# Builds arangojs with the repo toolchain (TypeScript 6) and packs the publishable
# tarball for consumer compat workflows. Safe to remove if compat testing is dropped.
name: Compat pack

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: compat-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pack publishable tarball
        run: |
          cd build
          npm pack
          mv arangojs-*.tgz ../arangojs-pack.tgz

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: arangojs-pack
          path: arangojs-pack.tgz
          retention-days: 7

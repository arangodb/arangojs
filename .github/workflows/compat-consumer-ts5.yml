# Simulates a customer on TypeScript 5 installing the packed arangojs release.
# Runs after "Compat pack" succeeds (parallel with compat-consumer-ts6.yml).
# Safe to remove if compat testing is dropped.
name: Compat consumer TS 5

on:
  workflow_run:
    workflows:
      - Compat pack
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  consumer:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download pack artifact
        uses: actions/download-artifact@v4
        with:
          name: arangojs-pack
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: pack

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck as TypeScript 5 consumer
        working-directory: compat-test
        run: |
          npm install --save-dev typescript@5.4.5
          npm install --save arangojs@file:../pack/arangojs-pack.tgz
          npx tsc --noEmit

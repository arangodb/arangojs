version: 2.1

parameters:
  docker-img:
    type: string
    default: ''

commands:
  timeout:
    parameters:
      duration:
        default: '15m'
        type: string
    steps:
      - run:
          name: Cancel job after <<parameters.duration>>
          background: true
          command: |
            sleep <<parameters.duration>>
            echo "Cancelling job as <<parameters.duration>> has elapsed"
            curl --fail -X POST -H "Circle-Token: ${CIRCLE_TOKEN}" "https://circleci.com/api/v1.1/project/github/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BUILD_NUM}/cancel"

  setup-docker:
    description: >
      Install Docker and start dockerd in the job container. Requires a *-privileged resource class.
    steps:
      - run:
          name: Set up Docker
          command: |
            set -euo pipefail
            if ! command -v docker >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends docker.io
            fi
            if ! docker info >/dev/null 2>&1; then
              sudo dockerd >/tmp/dockerd.log 2>&1 &
              for _ in $(seq 1 30); do
                sudo docker info >/dev/null 2>&1 && break
                sleep 1
              done
              sudo chmod 666 /var/run/docker.sock
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "Docker not reachable by $(whoami); last lines of /tmp/dockerd.log:"
              tail -50 /tmp/dockerd.log || true
              exit 1
            fi
            docker info

  login-docker-hub:
    description: >
      Docker Hub login before start_db.sh pulls. Uses DOCKER_HUB_USER and
      DOCKER_HUB_PASSWORD from project or CircleCI context.
    steps:
      - run:
          name: Login to Docker Hub
          command: |
            set -euo pipefail
            USER="${DOCKER_HUB_USER:-}"
            PASS="${DOCKER_HUB_PASSWORD:-}"
            if [ -z "$USER" ] || [ -z "$PASS" ]; then
              echo "Docker Hub credentials required."
              echo "Set DOCKER_HUB_USER and DOCKER_HUB_PASSWORD in project or context."
              echo "Workflow jobs must attach context: docker-hub"
              exit 1
            fi
            echo "$PASS" | docker login -u "$USER" --password-stdin

  start-db:
    parameters:
      docker-img:
        type: string
        default: 'gcr.io/gcr-for-testing/arangodb/enterprise:latest'
      topology:
        type: string
        default: 'single'
      ssl:
        type: string
        default: 'false'
      compression:
        type: string
        default: 'false'
    steps:
      - run:
          name: Start Database
          command: bash ./docker/start_db.sh
          environment:
            DOCKER_IMAGE: <<parameters.docker-img>>
            STARTER_MODE: <<parameters.topology>>
            STARTER_DOCKER_IMAGE: 'docker.io/arangodb/arangodb-starter:0.18.5'
            SSL: <<parameters.ssl>>
            COMPRESSION: <<parameters.compression>>

executors:
  n22:
    docker:
      - image: cimg/node:22.22.3
    resource_class: arangodb/medium-arm64-privileged
  n24:
    docker:
      - image: cimg/node:24.16.0
    resource_class: arangodb/medium-arm64-privileged
  n24-browser:
    docker:
      - image: cimg/node:24.16.0
    resource_class: arangodb/medium-amd64-privileged

jobs:
  node-test:
    parameters:
      docker-img:
        type: string
        default: 'gcr.io/gcr-for-testing/arangodb/enterprise:latest'
      topology:
        type: string
        default: 'single'
      ssl:
        type: string
        default: 'false'
      http_proto:
        type: enum
        enum: ['h1', 'h2']
        default: 'h1'
      node:
        type: enum
        enum: ['n22', 'n24']
      module-system:
        type: enum
        enum: ['cjs', 'esm']
    executor: <<parameters.node>>
    steps:
      - timeout
      - checkout
      - setup-docker
      - login-docker-hub
      - start-db:
          docker-img: <<parameters.docker-img>>
          topology: <<parameters.topology>>
          ssl: <<parameters.ssl>>
      - run:
          name: Install system packages
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq curl
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests
          command: |
            set -euo pipefail
            SCHEME=http
            if [ "<<parameters.ssl>>" = "true" ]; then
              SCHEME=https
              export NODE_TLS_REJECT_UNAUTHORIZED=0
            fi
            if [ "<<parameters.topology>>" = "cluster" ]; then
              export TEST_ARANGODB_URL="${SCHEME}://172.28.0.1:8529,${SCHEME}://172.28.0.1:8539,${SCHEME}://172.28.0.1:8549"
              export TEST_ARANGO_LOAD_BALANCING_STRATEGY=ROUND_ROBIN
            else
              export TEST_ARANGODB_URL="${SCHEME}://172.28.0.1:8529"
            fi
            if [ "<<parameters.http_proto>>" = "h2" ]; then
              export TEST_ARANGO_HTTP_VERSION=2.0
            else
              export TEST_ARANGO_HTTP_VERSION=1.1
            fi
            export ARANGO_RELEASE="<<parameters.docker-img>>"
            export CI=true
            npm run test:<<parameters.module-system>>

  browser-smoke:
    parameters:
      docker-img:
        type: string
    executor: n24-browser
    steps:
      - timeout
      - checkout
      - setup-docker
      - login-docker-hub
      - start-db:
          docker-img: <<parameters.docker-img>>
          topology: single
          ssl: 'false'
      - run:
          name: Install Google Chrome (AMD64)
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends curl ca-certificates \
              fonts-liberation \
              libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcairo2 libcups2t64 \
              libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 libglib2.0-0t64 \
              libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 \
              libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 \
              libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6
            curl -fsSL -o /tmp/google-chrome.deb \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/google-chrome.deb
            rm /tmp/google-chrome.deb
            google-chrome-stable --version
      - run:
          name: Install dependencies and build
          command: |
            sudo apt-get install -y --no-install-recommends jq
            npm install
            npm run build
          environment:
            PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run:
          name: Run browser smoke test
          command: node smoke-test.mjs
          environment:
            PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
            ARANGO_PROXY_TARGET: 172.28.0.1:8529

workflows:
  # 16 jobs: single-server only. HTTP/1.1 (default http_proto). 2 DB × 2 Node × 2 SSL × 2 module systems.
  integration-single-topology:
    when:
      not: <<pipeline.parameters.docker-img>>
    jobs:
      - node-test:
          name: single-<<matrix.node>>-ssl<<matrix.ssl>>-<<matrix.module-system>>-312
          context: docker-hub
          topology: single
          filters:
            branches:
              ignore: stable
          matrix:
            parameters:
              docker-img:
                - 'gcr.io/gcr-for-testing/arangodb/enterprise:3.12'
              node:
                - 'n22'
                - 'n24'
              ssl:
                - 'true'
                - 'false'
              module-system:
                - 'cjs'
                - 'esm'
      - node-test:
          name: single-<<matrix.node>>-ssl<<matrix.ssl>>-<<matrix.module-system>>-4.0-nightly
          context: docker-hub
          topology: single
          filters:
            branches:
              ignore: stable
          matrix:
            parameters:
              docker-img:
                - 'gcr.io/gcr-for-testing/arangodb/enterprise-preview:4.0-nightly'
              node:
                - 'n22'
                - 'n24'
              ssl:
                - 'true'
                - 'false'
              module-system:
                - 'cjs'
                - 'esm'

  # 16 jobs: cluster only. HTTP/1.1 (default http_proto). Same matrix as single.
  integration-cluster-topology:
    when:
      not: <<pipeline.parameters.docker-img>>
    jobs:
      - node-test:
          name: cluster-<<matrix.node>>-ssl<<matrix.ssl>>-<<matrix.module-system>>-312
          context: docker-hub
          topology: cluster
          filters:
            branches:
              ignore: stable
          matrix:
            parameters:
              docker-img:
                - 'gcr.io/gcr-for-testing/arangodb/enterprise:3.12'
              node:
                - 'n22'
                - 'n24'
              ssl:
                - 'true'
                - 'false'
              module-system:
                - 'cjs'
                - 'esm'
      - node-test:
          name: cluster-<<matrix.node>>-ssl<<matrix.ssl>>-<<matrix.module-system>>-4.0-nightly
          context: docker-hub
          topology: cluster
          filters:
            branches:
              ignore: stable
          matrix:
            parameters:
              docker-img:
                - 'gcr.io/gcr-for-testing/arangodb/enterprise-preview:4.0-nightly'
              node:
                - 'n22'
                - 'n24'
              ssl:
                - 'true'
                - 'false'
              module-system:
                - 'cjs'
                - 'esm'

  # 2 jobs: HTTP/1.1 vs HTTP/2 on a fixed "best" stack (Enterprise 3.12, Node 24, ESM, TLS, single).
  integration-http-proto-smoke:
    when:
      not: <<pipeline.parameters.docker-img>>
    jobs:
      - node-test:
          name: http-proto-h1-smoke
          context: docker-hub
          filters:
            branches:
              ignore: stable
          docker-img: 'gcr.io/gcr-for-testing/arangodb/enterprise:3.12'
          topology: single
          ssl: 'true'
          http_proto: h1
          node: n24
          module-system: esm
      - node-test:
          name: http-proto-h2-smoke
          context: docker-hub
          filters:
            branches:
              ignore: stable
          docker-img: 'gcr.io/gcr-for-testing/arangodb/enterprise:3.12'
          topology: single
          ssl: 'true'
          http_proto: h2
          node: n24
          module-system: esm

  # 2 jobs: browser bundling smoke (Puppeteer) on pinned DB images.
  browser-smoke:
    when:
      not: <<pipeline.parameters.docker-img>>
    jobs:
      - browser-smoke:
          name: browser-smoke-312
          context: docker-hub
          filters:
            branches:
              ignore: stable
          docker-img: 'gcr.io/gcr-for-testing/arangodb/enterprise:3.12'
      - browser-smoke:
          name: browser-smoke-4.0-nightly
          context: docker-hub
          filters:
            branches:
              ignore: stable
          docker-img: 'gcr.io/gcr-for-testing/arangodb/enterprise-preview:4.0-nightly'

  # Manual pipeline (docker-img set): driver matrix on your image (16 jobs).
  integration-tests-given-db-image:
    when: <<pipeline.parameters.docker-img>>
    jobs:
      - node-test:
          name: <<matrix.node>>-<<matrix.topology>>-ssl<<matrix.ssl>>-<<matrix.module-system>>
          context: docker-hub
          filters:
            branches:
              ignore: stable
          matrix:
            parameters:
              docker-img:
                - <<pipeline.parameters.docker-img>>
              node:
                - 'n22'
                - 'n24'
              topology:
                - 'single'
                - 'cluster'
              ssl:
                - 'true'
                - 'false'
              module-system:
                - 'cjs'
                - 'esm'

  # Manual pipeline (docker-img set): HTTP/1.1 vs HTTP/2 smoke (2 jobs). 
  integration-http-proto-smoke-given-db-image:
    when: <<pipeline.parameters.docker-img>>
    jobs:
      - node-test:
          name: http-proto-h1-smoke
          context: docker-hub
          filters:
            branches:
              ignore: stable
          docker-img: <<pipeline.parameters.docker-img>>
          topology: single
          ssl: 'true'
          http_proto: h1
          node: n24
          module-system: esm
      - node-test:
          name: http-proto-h2-smoke
          context: docker-hub
          filters:
            branches:
              ignore: stable
          docker-img: <<pipeline.parameters.docker-img>>
          topology: single
          ssl: 'true'
          http_proto: h2
          node: n24
          module-system: esm

  # Manual pipeline (docker-img set): browser bundling smoke (1 job).
  browser-smoke-given-db-image:
    when: <<pipeline.parameters.docker-img>>
    jobs:
      - browser-smoke:
          name: browser-smoke
          context: docker-hub
          filters:
            branches:
              ignore: stable
          docker-img: <<pipeline.parameters.docker-img>>